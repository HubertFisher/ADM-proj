version: "3.8"

x-mongo-common: &mongo-common
  image: mongo:latest
  restart: unless-stopped
  networks:
    - mongo-net

services:

  # CONFIG SERVERS
  config1:
    <<: *mongo-common
    container_name: config1
    command: ["mongod", "--configsvr", "--replSet", "configRS", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: ["config1-data:/data/db"]

  config2:
    <<: *mongo-common
    container_name: config2
    command: ["mongod", "--configsvr", "--replSet", "configRS", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: ["config2-data:/data/db"]

  config3:
    <<: *mongo-common
    container_name: config3
    command: ["mongod", "--configsvr", "--replSet", "configRS", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: ["config3-data:/data/db"]

  # SHARD 1
  shard1a:
    <<: *mongo-common
    container_name: shard1a
    command: ["mongod", "--shardsvr", "--replSet", "shard1RS", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: ["shard1a-data:/data/db"]

  shard1b:
    <<: *mongo-common
    container_name: shard1b
    command: ["mongod", "--shardsvr", "--replSet", "shard1RS", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: ["shard1b-data:/data/db"]

  shard1c:
    <<: *mongo-common
    container_name: shard1c
    command: ["mongod", "--shardsvr", "--replSet", "shard1RS", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: ["shard1c-data:/data/db"]

  # SHARD 2
  shard2a:
    <<: *mongo-common
    container_name: shard2a
    command: ["mongod", "--shardsvr", "--replSet", "shard2RS", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: ["shard2a-data:/data/db"]

  shard2b:
    <<: *mongo-common
    container_name: shard2b
    command: ["mongod", "--shardsvr", "--replSet", "shard2RS", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: ["shard2b-data:/data/db"]

  shard2c:
    <<: *mongo-common
    container_name: shard2c
    command: ["mongod", "--shardsvr", "--replSet", "shard2RS", "--port", "27017", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: ["shard2c-data:/data/db"]

  # ROUTER 
  mongos1:
    <<: *mongo-common
    container_name: mongos1
    command: ["mongos", "--configdb", "configRS/config1:27017,config2:27017,config3:27017", "--port", "27017", "--bind_ip_all"]
    ports:
      - "27017:27017"


 # INITIALIZER
  cluster-init:
    image: mongo:latest
    container_name: cluster-init
    restart: "no"
    networks:
      - mongo-net
    volumes:
      - ./scripts/init-cluster.js:/scripts/init-cluster.js:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for all nodes to be available..."
        
        # Check availability of config servers and shard primaries
        for node in config1 shard1a shard2a; do
          echo "checking $$node..."
          while ! mongosh --host "$$node" --port 27017 --eval "db.adminCommand('ping')" --quiet >/dev/null 2>&1; do
            sleep 2
          done
          echo "Node $$node is available."
        done
        
        set -euo pipefail
        echo "Starting cluster initialization..."
        mongosh --nodb /scripts/init-cluster.js

networks:
  mongo-net:
    driver: bridge
    name: mongo-net

volumes:
  config1-data:
  config2-data:
  config3-data:
  shard1a-data:
  shard1b-data:
  shard1c-data:
  shard2a-data:
  shard2b-data:
  shard2c-data: