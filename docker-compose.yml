x-mongod-healthcheck: &mongod-healthcheck
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

x-mongo-service: &mongo-service
  image: mongo:8.0.29
  restart: unless-stopped

services:
  config1:
    <<: *mongo-service
    command:
      ["mongod", "--configsvr", "--replSet", "configRS", "--port", "27019", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: [config1-v8-data:/data/configdb]
    healthcheck:
      <<: *mongod-healthcheck
      test: ["CMD", "mongosh", "--quiet", "--port", "27019", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)"]

  config2:
    <<: *mongo-service
    command:
      ["mongod", "--configsvr", "--replSet", "configRS", "--port", "27019", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: [config2-v8-data:/data/configdb]
    healthcheck:
      <<: *mongod-healthcheck
      test: ["CMD", "mongosh", "--quiet", "--port", "27019", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)"]

  config3:
    <<: *mongo-service
    command:
      ["mongod", "--configsvr", "--replSet", "configRS", "--port", "27019", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: [config3-v8-data:/data/configdb]
    healthcheck:
      <<: *mongod-healthcheck
      test: ["CMD", "mongosh", "--quiet", "--port", "27019", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)"]

  shard1a:
    <<: *mongo-service
    command:
      ["mongod", "--shardsvr", "--replSet", "shard1RS", "--port", "27018", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: [shard1a-v8-data:/data/db]
    healthcheck:
      <<: *mongod-healthcheck
      test: ["CMD", "mongosh", "--quiet", "--port", "27018", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)"]

  shard1b:
    <<: *mongo-service
    command:
      ["mongod", "--shardsvr", "--replSet", "shard1RS", "--port", "27018", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: [shard1b-v8-data:/data/db]
    healthcheck:
      <<: *mongod-healthcheck
      test: ["CMD", "mongosh", "--quiet", "--port", "27018", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)"]

  shard1c:
    <<: *mongo-service
    command:
      ["mongod", "--shardsvr", "--replSet", "shard1RS", "--port", "27018", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: [shard1c-v8-data:/data/db]
    healthcheck:
      <<: *mongod-healthcheck
      test: ["CMD", "mongosh", "--quiet", "--port", "27018", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)"]

  shard2a:
    <<: *mongo-service
    command:
      ["mongod", "--shardsvr", "--replSet", "shard2RS", "--port", "27018", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: [shard2a-v8-data:/data/db]
    healthcheck:
      <<: *mongod-healthcheck
      test: ["CMD", "mongosh", "--quiet", "--port", "27018", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)"]

  shard2b:
    <<: *mongo-service
    command:
      ["mongod", "--shardsvr", "--replSet", "shard2RS", "--port", "27018", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: [shard2b-v8-data:/data/db]
    healthcheck:
      <<: *mongod-healthcheck
      test: ["CMD", "mongosh", "--quiet", "--port", "27018", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)"]

  shard2c:
    <<: *mongo-service
    command:
      ["mongod", "--shardsvr", "--replSet", "shard2RS", "--port", "27018", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: [shard2c-v8-data:/data/db]
    healthcheck:
      <<: *mongod-healthcheck
      test: ["CMD", "mongosh", "--quiet", "--port", "27018", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)"]

  replica-set-init:
    image: mongo:8.0.29
    restart: "no"
    depends_on:
      config1: { condition: service_healthy }
      config2: { condition: service_healthy }
      config3: { condition: service_healthy }
      shard1a: { condition: service_healthy }
      shard1b: { condition: service_healthy }
      shard1c: { condition: service_healthy }
      shard2a: { condition: service_healthy }
      shard2b: { condition: service_healthy }
      shard2c: { condition: service_healthy }
    volumes: [./scripts:/scripts:ro]
    entrypoint: ["mongosh", "--quiet", "--host", "config1", "--port", "27019", "--file", "/scripts/init-replica-sets.js"]

  mongos:
    image: mongo:8.0.29
    restart: unless-stopped
    depends_on:
      replica-set-init: { condition: service_completed_successfully }
    command:
      ["mongos", "--configdb", "configRS/config1:27019,config2:27019,config3:27019", "--port", "27017", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: [./scripts:/scripts:ro]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "27017", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  cluster-init:
    image: mongo:8.0.29
    restart: "no"
    depends_on:
      mongos: { condition: service_healthy }
    volumes: [./scripts:/scripts:ro]
    entrypoint: ["mongosh", "--quiet", "--host", "mongos", "--port", "27017", "--file", "/scripts/init-sharded-cluster.js"]

  ingest:
    profiles: ["ingest"]
    build: .
    restart: "no"
    depends_on:
      cluster-init: { condition: service_completed_successfully }
    environment:
      METROPT_INPUT_PATH: /data/metropt+3+dataset.zip
      METROPT_MONGO_URI: mongodb://mongos:27017
      METROPT_SOURCE_TIMEZONE: ${METROPT_SOURCE_TIMEZONE:-}
      METROPT_UNIT_ID: ${METROPT_UNIT_ID:-APU_METRO_01}
    volumes:
      - "${METROPT_INPUT_PATH:-./data/metropt+3+dataset.zip}:/data/metropt+3+dataset.zip:ro"

volumes:
  config1-v8-data:
  config2-v8-data:
  config3-v8-data:
  shard1a-v8-data:
  shard1b-v8-data:
  shard1c-v8-data:
  shard2a-v8-data:
  shard2b-v8-data:
  shard2c-v8-data:
